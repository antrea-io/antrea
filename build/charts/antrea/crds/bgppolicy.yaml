apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bgppolicies.crd.antrea.io
spec:
  group: crd.antrea.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - nodeSelector
                - localASN
              properties:
                nodeSelector:
                  type: object
                  properties:
                    matchExpressions:
                      items:
                        properties:
                          key:
                            type: string
                          operator:
                            enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                            type: string
                          values:
                            items:
                              type: string
                              pattern: "^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$"
                            type: array
                        type: object
                      type: array
                    matchLabels:
                      x-kubernetes-preserve-unknown-fields: true
                localASN:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                listenPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  default: 179
                confederation:
                  type: object
                  properties:
                    identifier:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                    memberASNs:
                      type: array
                      items:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                advertisements:
                  type: object
                  properties:
                    service:
                      type: object
                      properties:
                        ipTypes:
                          type: array
                          items:
                            type: string
                            enum:
                              - ClusterIP
                              - LoadBalancerIP
                              - ExternalIP
                    pod:
                      type: object
                      properties: {}
                    egress:
                      type: object
                      properties: {}
                bgpPeers:
                  type: array
                  items:
                    type: object
                    required:
                      - address
                      - asn
                    x-kubernetes-validations:
                      # holdTimeSeconds is defaulted, so the rule reads it without a has() guard. Only the hard
                      # floor is enforced: a keepalive interval at or above the hold time can never refresh the
                      # peer's hold timer in time. The RFC 4271 one third ratio is guidance in docs/bgp-policy.md.
                      - rule: "!has(self.keepaliveIntervalSeconds) || self.keepaliveIntervalSeconds < self.holdTimeSeconds"
                        message: "keepaliveIntervalSeconds must be less than holdTimeSeconds"
                    properties:
                      address:
                        type: string
                        oneOf:
                          - format: ipv4
                          - format: ipv6
                      port:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                        default: 179
                      asn:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                      multihopTTL:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 255
                        default: 1
                      gracefulRestartEnabled:
                        type: boolean
                        default: true
                      gracefulRestartTimeSeconds:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 3600
                        default: 120
                      holdTimeSeconds:
                        type: integer
                        format: int32
                        minimum: 3
                        maximum: 65535
                        default: 90
                      # Deliberately not defaulted: the BGP process derives an unset keepalive interval from the
                      # effective hold time. See docs/bgp-policy.md for why a fixed default is wrong here.
                      keepaliveIntervalSeconds:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65534
                      connectRetrySeconds:
                        type: integer
                        format: int32
                        minimum: 2
                        maximum: 65535
                        default: 120
                      idleHoldTimeAfterResetSeconds:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 3600
                        default: 30
      additionalPrinterColumns:
        - description: Local BGP AS number
          jsonPath: .spec.localASN
          name: Local ASN
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
  scope: Cluster
  names:
    plural: bgppolicies
    singular: bgppolicy
    kind: BGPPolicy
