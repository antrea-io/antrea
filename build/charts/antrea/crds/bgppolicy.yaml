apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bgppolicies.crd.antrea.io
spec:
  group: crd.antrea.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - nodeSelector
                - localASN
              properties:
                nodeSelector:
                  type: object
                  properties:
                    matchExpressions:
                      items:
                        properties:
                          key:
                            type: string
                          operator:
                            enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                            type: string
                          values:
                            items:
                              type: string
                              pattern: "^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$"
                            type: array
                        type: object
                      type: array
                    matchLabels:
                      x-kubernetes-preserve-unknown-fields: true
                localASN:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                listenPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  default: 179
                confederation:
                  type: object
                  properties:
                    identifier:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                    memberASNs:
                      type: array
                      items:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                advertisements:
                  type: object
                  properties:
                    service:
                      type: object
                      properties:
                        ipTypes:
                          type: array
                          items:
                            type: string
                            enum:
                              - ClusterIP
                              - LoadBalancerIP
                              - ExternalIP
                        med:
                          type: object
                          description: >-
                            Configures the MULTI_EXIT_DISC path attribute attached to the advertised
                            Service IP routes. When it is unset, no MED attribute is attached.
                          properties:
                            mode:
                              type: string
                              description: >-
                                None disables the MED attribute. Static attaches baseValue to every
                                route on every Node. NodePriority attaches a distinct value per Node
                                to the IPs allocated from an ExternalIPPool, so that every Node of
                                the pool advertises the IP and the Node which owns it advertises the
                                most preferred path.
                              enum:
                                - None
                                - Static
                                - NodePriority
                              default: None
                            baseValue:
                              type: integer
                              format: int64
                              description: >-
                                The MED advertised in the Static mode, and the MED advertised by the
                                most preferred Node in the NodePriority mode. A value of 0 disables
                                the attribute.
                              minimum: 0
                              maximum: 4294967295
                              default: 100
                            step:
                              type: integer
                              format: int64
                              description: >-
                                The MED increment applied per Node rank in the NodePriority mode.
                              minimum: 1
                              maximum: 4294967295
                              default: 100
                            maxAdvertisingNodes:
                              type: integer
                              format: int32
                              description: >-
                                How many Nodes of an ExternalIPPool advertise each of its IPs in the
                                NodePriority mode. 0 means all of them.
                              minimum: 0
                              maximum: 65535
                              default: 0
                            allowServiceOverride:
                              type: boolean
                              description: >-
                                Whether the "service.antrea.io/bgp-med" and
                                "service.antrea.io/bgp-med-mode" Service annotations are honored.
                              default: true
                    pod:
                      type: object
                      properties: {}
                    egress:
                      type: object
                      properties: {}
                bgpPeers:
                  type: array
                  items:
                    type: object
                    required:
                      - address
                      - asn
                    properties:
                      address:
                        type: string
                        oneOf:
                          - format: ipv4
                          - format: ipv6
                      port:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                        default: 179
                      asn:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 65535
                      multihopTTL:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 255
                        default: 1
                      gracefulRestartTimeSeconds:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 3600
                        default: 120
      additionalPrinterColumns:
        - description: Local BGP AS number
          jsonPath: .spec.localASN
          name: Local ASN
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
  scope: Cluster
  names:
    plural: bgppolicies
    singular: bgppolicy
    kind: BGPPolicy
