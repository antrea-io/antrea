apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: antreanodeconfigs.crd.antrea.io
  labels:
    app: antrea
spec:
  group: crd.antrea.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
          - spec
          properties:
            spec:
              type: object
              required:
                - nodeSelector
              properties:
                nodeSelector:
                  description: Selects Nodes to which this AntreaNodeConfig applies.
                  type: object
                  properties:
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                          values:
                            type: array
                            items:
                              type: string
                              pattern: "^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$"
                    matchLabels:
                      x-kubernetes-preserve-unknown-fields: true
                secondaryNetwork:
                  description: Secondary network bridge configuration for the selected Nodes.
                  type: object
                  properties:
                    ovsBridges:
                      description: >-
                        OVS bridge configurations for secondary networks.
                        At the moment, only a single OVS bridge is supported.
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - bridgeName
                      maxItems: 1
                      x-kubernetes-validations:
                        - rule: "oldSelf.all(o, self.exists(s, s.bridgeName == o.bridgeName))"
                          message: "bridgeName is immutable — existing bridge names cannot be removed or renamed"
                      items:
                        type: object
                        required:
                          - bridgeName
                        properties:
                          bridgeName:
                            description: Name of the OVS bridge.
                            type: string
                            minLength: 1
                            maxLength: 15
                            pattern: '^[a-zA-Z0-9._-]+$'
                          physicalInterfaces:
                            description: >-
                              Physical interfaces to be connected to this bridge.
                            type: array
                            maxItems: 8
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys:
                              - name
                            items:
                              type: object
                              required:
                                - name
                              properties:
                                name:
                                  description: Name of the physical interface.
                                  type: string
                                  minLength: 1
                                  maxLength: 15
                                  pattern: '^[a-zA-Z0-9._-]+$'
                                allowedVLANs:
                                  description: >-
                                    VLAN IDs or VLAN ID ranges (e.g. "100",
                                    "200-300") allowed on this interface.
                                    If not specified, all VLANs are allowed.
                                  type: array
                                  x-kubernetes-list-type: set
                                  items:
                                    type: string
                                    pattern: '^((?:[0-9]{1,3}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4])|(?:[0-9]{1,3}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4])-(?:[0-9]{1,3}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4]))$'
                          enableMulticastSnooping:
                            description: >-
                              Enable multicast snooping on the bridge so that
                              multicast traffic is forwarded only to ports with
                              interested receivers. Defaults to false.
                            type: boolean
                            default: false
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                desiredNodes:
                  type: integer
                  format: int32
                  minimum: 0
                realizedNodes:
                  type: integer
                  format: int32
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                  - type
                  items:
                    type: object
                    required:
                    - type
                    - status
                    - reason
                    - message
                    - lastTransitionTime
                    properties:
                      type:
                        type: string
                        maxLength: 128
                      status:
                        type: string
                        enum:
                        - 'True'
                        - 'False'
                        - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                        maxLength: 128
                      message:
                        type: string
                        maxLength: 512
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.desiredNodes
          name: Desired
          type: integer
        - jsonPath: .status.realizedNodes
          name: Realized
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
  scope: Cluster
  names:
    plural: antreanodeconfigs
    singular: antreanodeconfig
    kind: AntreaNodeConfig
    shortNames:
      - anc
