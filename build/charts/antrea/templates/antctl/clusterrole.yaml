kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antctl
  labels:
    app: antrea
rules:
  - apiGroups:
      - controlplane.antrea.io
    resources:
      - networkpolicies
      - appliedtogroups
      - addressgroups
    verbs:
      - get
      - list
  - apiGroups:
      - controlplane.antrea.io
    resources:
      - networkpolicyevaluation
    verbs:
      - create
  - apiGroups:
      - stats.antrea.io
    resources:
      - networkpolicystats
      - antreaclusternetworkpolicystats
      - antreanetworkpolicystats
    verbs:
      - get
      - list
  - apiGroups:
      - system.antrea.io
    resources:
      - controllerinfos
    verbs:
      - get
  - apiGroups:
      - system.antrea.io
    resources:
      - supportbundles
    verbs:
      - create
      - get
  - apiGroups:
      - system.antrea.io
    resources:
      - supportbundles/download
    verbs:
      - get
  - nonResourceURLs:
      - /agentinfo
      - /addressgroups
      - /appliedtogroups
      - /loglevel
      - /networkpolicies
      - /ovsflows
      - /ovstracing
      - /podinterfaces
      - /podmulticaststats
      - /featuregates
      - /serviceexternalip
      - /memberlist
      - /bgppolicy
      - /bgppeers
      - /bgproutes
      - /fqdncache
      - /metrics
      - /debug/pprof
      - /debug/pprof/*
    verbs:
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreacontrollerinfos
      - antreaagentinfos
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  # "antctl observe" tunnels to the Flow Aggregator Pod through the API server's /portforward
  # subresource when it has no direct network route to the Pod (see pkg/antctl/raw/observe).
  - apiGroups:
      - ""
    resources:
      - pods/portforward
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - replicasets
    verbs:
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      # "get" is needed by "antctl observe --flow-aggregator <namespace>/<deployment-name>" (see
      # findFlowAggregatorByName in pkg/antctl/raw/observe/discovery.go), which resolves a specific
      # instance by Deployment name rather than by listing and filtering.
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - antrea-config
      - antrea-ca
      - antrea-ipsec-ca
      - antrea-cluster-identity
      # Read by "antctl observe" to verify the Flow Aggregator's TLS certificate (see
      # pkg/antctl/raw/observe/connect.go).
      - flow-aggregator-ca
    verbs:
      - get
