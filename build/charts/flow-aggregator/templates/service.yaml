apiVersion: v1
kind: Service
metadata:
  labels:
    app: flow-aggregator
    {{- if .Values.flowStreamService.enable }}
    # Lets FlowStreamService clients discover this Service when several Flow Aggregators are deployed.
    observability.antrea.io/flow-stream-service: "true"
    {{- end }}
  name: {{ include "flow-aggregator.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: flow-aggregator
  ports:
  - name: ipfix-udp
    port: 4739
    protocol: UDP
    targetPort: ipfix-udp
  - name: ipfix-tcp
    port: 4739
    protocol: TCP
    targetPort: ipfix-tcp
  - name: grpc
    port: 14739
    protocol: TCP
    targetPort: grpc
  {{- if .Values.flowStreamService.enable }}
  - name: flowstream-grpc
    port: 14740
    protocol: TCP
    targetPort: flowstream-grpc
  {{- end }}
