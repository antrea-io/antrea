kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ include "flow-aggregator.clusterScopedName" . }}-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "flow-aggregator.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "flow-aggregator.clusterScopedName" . }}-role
  apiGroup: rbac.authorization.k8s.io
---
# For auth delegation to apiserver
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ include "flow-aggregator.clusterScopedName" . }}-auth-delegator-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "flow-aggregator.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.flowStreamService.enable }}
---
# Required to run "antctl observer" inside the Flow Aggregator Pod, using the Pod's SA.
# This grant is needed for FlowStreamService's RBAC to pass. It grants access to "flows"
# at cluster level, which also implies "flows/identity".
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ include "flow-aggregator.clusterScopedName" . }}-flow-viewer
subjects:
  - kind: ServiceAccount
    name: {{ include "flow-aggregator.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: antrea-flow-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
