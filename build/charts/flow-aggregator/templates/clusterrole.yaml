kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ include "flow-aggregator.clusterScopedName" . }}-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["crd.antrea.io"]
    resources: ["flowaccesscontrols"]
    verbs: ["get", "list", "watch"]
