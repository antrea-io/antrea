# TEMPORARY: DO NOT MERGE. Remove this workflow before merging the PR.
# Runs the upstream conformance tests with linux/arm/v7 Antrea images on the PR,
# using the same steps as conformance.yml (which can only be triggered with
# workflow_dispatch).
name: "[TEMP] Conformance tests with linux/arm/v7 images"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests (linux/arm/v7)
    runs-on: oracle-vm-2cpu-8gb-arm64
    steps:
      - name: Free disk space
        run: |
          sudo apt-get clean
          df -h
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      # Docker 29+ defaults to the containerd image store, which breaks kind load docker-image.
      - uses: ./.github/actions/setup-docker-classic
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Build Antrea image
        run: |
          ./hack/build-antrea-linux-all.sh --pull --distro ubuntu --platform linux/arm/v7
      - name: Check Antrea image architecture
        run: |
          docker image inspect antrea/antrea-agent-ubuntu:latest --format '{{.Os}}/{{.Architecture}}/{{.Variant}}'
          docker run --rm --platform linux/arm/v7 --entrypoint antrea-agent antrea/antrea-agent-ubuntu:latest --version
      - uses: ./.github/actions/setup-kind
      - name: Create K8s cluster
        run: |
          images=()
          images+=(antrea/antrea-controller-ubuntu:latest)
          images+=(antrea/antrea-agent-ubuntu:latest)
          ./ci/kind/kind-setup.sh create kind \
            --images "${images[*]}"
      - name: Install Antrea
        run: |
          helm install --namespace kube-system antrea ./build/charts/antrea \
            --set controllerImage.repository="antrea/antrea-controller-ubuntu" \
            --set agentImage.repository="antrea/antrea-agent-ubuntu"
          kubectl rollout status -n kube-system ds/antrea-agent --timeout=5m
      - name: Print Antrea Pod status and logs on failure
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n kube-system describe pods -l app=antrea || true
          kubectl -n kube-system logs -l app=antrea --all-containers --prefix --tail=100 || true
      - name: Run e2e tests
        run: |
          ./ci/run-k8s-e2e-tests.sh "--e2e-conformance"
      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: sonobuoy.tar.gz
          path: "*_sonobuoy_*.tar.gz"
          retention-days: 7
