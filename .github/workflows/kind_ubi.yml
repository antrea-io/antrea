name: Kind for UBI
on:
  pull_request:
    branches:
    - main
    - release-*
    - feature/*
  push:
    branches:
    - main
    - release-*
    - feature/*

jobs:
  check-changes:
    name: Check whether tests need to be run based on diff
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        show-progress: false
    - uses: antrea-io/has-changes@8af46c0ea505faf5c57d655802471141dc1ecc26 # v2.3.0
      id: check_diff
      with:
        paths-ignore: docs/* ci/jenkins/* *.md hack/.notableofcontents plugins/*
    outputs:
      has_changes: ${{ steps.check_diff.outputs.has_changes }}

  build-and-test-ubi:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.has_changes == 'yes' || github.event_name == 'push' }}
    runs-on: [ubuntu-latest]
    steps:
    - name: Free disk space
      # This job builds a multi-arch UBI9 Docker image with no prior layer cache, which can
      # exhaust the runner's disk.
      # https://github.com/actions/virtual-environments/issues/709
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf "/usr/local/lib/android"
        df -h
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
    # Docker 29+ defaults to the containerd image store, which breaks kind load docker-image.
    - uses: ./.github/actions/setup-docker-classic
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver: docker
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
    - name: Build Antrea UBI9 Docker image
      run: |
        ./hack/build-antrea-linux-all.sh --pull --distro ubi
    - name: Clean up docker build cache
      run: |
        docker builder prune -f
    - uses: ./.github/actions/setup-kind
    - name: Run basic e2e tests
      run: |
        mkdir log
        ANTREA_LOG_DIR=$PWD/log ./ci/kind/test-e2e-kind.sh --encap-mode encap \
        --antrea-controller-image antrea/antrea-controller-ubi \
        --antrea-agent-image antrea/antrea-agent-ubi \
        --run '^TestBasic$'
    - name: Tar log files
      if: ${{ failure() }}
      run: tar -czf log.tar.gz log
    - name: Upload test log
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ failure() }}
      with:
        name: e2e-kind-ubi-basic.tar.gz
        path: log.tar.gz
        retention-days: 30
