syntax = "proto3";

import "pkg/apis/flow/v1alpha1/flow.proto";
import "google/protobuf/timestamp.proto";

package antrea_io.antrea.pkg.apis.flow.v1alpha1;

option go_package = "pkg/apis/flow/v1alpha1";

service FlowExportService {
  rpc Export(stream ExportRequest) returns (ExportResponse);
}

message ExportRequest {
  repeated Flow flows = 1;
}

message ExportResponse {
}

// FlowStreamService provides a server-streaming RPC for real-time flow visibility.
//
// Clients must authenticate with a Kubernetes credential, and are authorized
// with standard Kubernetes RBAC against a virtual resource: "flows" in API group
// "flow.antrea.io", with verb "list" for a non-follow stream and "watch" for a
// follow stream, checked in each Namespace the request names (or cluster-wide).
// The virtual resource is served by no API server; it exists to be named in a
// Role or ClusterRole, the way kubelet authorizes "nodes/proxy".
service FlowStreamService {
  // GetFlows streams flow records matching the provided filters.
  // Historical flows (from the ring buffer) are sent first, followed by
  // real-time flows if follow is set to true.
  rpc GetFlows(GetFlowsRequest) returns (stream GetFlowsResponse);
}

// FlowFilterDirection controls which endpoint of a flow the directional filters
// (namespaces, pod_names, pod_label_selector, ips) are matched against.
// FROM applies filters to the source (sender) side, TO applies them to the
// destination (receiver) side, and BOTH (default) matches either side.
enum FlowFilterDirection {
  FLOW_FILTER_DIRECTION_BOTH = 0;
  FLOW_FILTER_DIRECTION_FROM = 1;
  FLOW_FILTER_DIRECTION_TO   = 2;
}

// FlowFilter specifies optional criteria to narrow which flows are returned.
// All specified filters are AND-ed; values within a repeated field are OR-ed.
// An absent or fully-empty filter matches all flows.
message FlowFilter {
  // Match flows where source or destination Pod namespace is in this list
  // (direction semantics are affected by the direction field).
  repeated string namespaces = 1;
  // Match flows where source or destination Pod name is in this list.
  // The match is on the bare Pod name without a namespace prefix; to restrict
  // to a specific namespace, combine this filter with the namespaces field.
  repeated string pod_names = 2;
  // Match flows where source or destination Pod labels match this selector.
  // Uses the same syntax as Kubernetes label selectors (e.g. "app=frontend").
  string pod_label_selector = 3;
  // Match flows where the destination Service name is in this list.
  // Provide the plain Service name without a namespace prefix (e.g. "frontend",
  // not "default/frontend"). The match is exact on the name only; to restrict
  // to a specific namespace combine this filter with the namespaces field.
  repeated string service_names = 4;
  // Match flows based on their type.
  repeated FlowType flow_types = 5;
  // Match flows by IP address (direction semantics are affected by the
  // direction field). CIDR notation is supported (e.g. "10.0.0.0/8").
  repeated string ips = 6;
  // Controls which endpoint of a flow the directional filters (namespaces,
  // pod_names, pod_label_selector, ips) are matched against.
  // FROM applies filters to the source (sender) side, TO applies them to the
  // destination (receiver) side, and BOTH (default) matches either side.
  //   BOTH (default) - match source OR destination
  //   FROM           - match source only
  //   TO             - match destination only
  // Cannot combine FROM with service_names (services are always a
  // destination-side concept).
  FlowFilterDirection direction = 7;
}

// GetFlowsRequest is sent once by the client when opening a GetFlows stream.
message GetFlowsRequest {
  // Filters to apply server-side. All filters are AND-ed together, so a flow
  // must match every filter to be returned. Each filter is independently
  // evaluated with its own direction. Providing no filters returns all flows.
  repeated FlowFilter filters = 1;
  // If set, only flows with end_ts >= since are returned.
  google.protobuf.Timestamp since = 2;
  // Maximum number of flows to return in total. 0 means no limit.
  uint32 max_count = 3;
  // If true, keep the stream open and push new flows as they arrive after
  // historical flows have been sent. If false, close after historical flows.
  bool follow = 4;
  // Request flows cluster-wide, including records that cannot be attributed to
  // any Namespace: both endpoints external, or no Kubernetes metadata at all.
  // This requires the permission cluster-wide, which only a ClusterRoleBinding
  // can grant, and is the only scope in which nothing is redacted.
  bool cluster_wide = 5;
  // The Namespaces the client is asking for flows in: a record is streamed if
  // its source or its destination Pod Namespace is one of them. This is the
  // scope of the request, not a filter; use filters to narrow it further.
  //
  // The client must be authorized to observe every Namespace it names, or the
  // whole request is rejected with PERMISSION_DENIED, naming the Namespaces
  // that were denied. A subset is never silently returned.
  //
  // Exactly one of namespaces and cluster_wide must be set. An empty
  // namespaces list with cluster_wide unset is rejected with
  // INVALID_ARGUMENT: it is reserved, and may come to mean "every Namespace I
  // am allowed to observe" in a later release. The server cannot answer that
  // today, because Kubernetes offers no reverse lookup from a subject to the
  // Namespaces it may access.
  repeated string namespaces = 6;
}

// GetFlowsResponse carries a batch of flow records from the server.
message GetFlowsResponse {
  // The matching flow records.
  repeated Flow flows = 1;
  // Number of flows dropped because the consumer fell behind and the ring
  // buffer wrapped around. Cumulative since the start of the stream.
  uint64 dropped_count = 2;
  // Set on the first message of a stream, and never after. It tells the client
  // what it is actually looking at, so that a UI can say so up front rather
  // than leave the user asking why a flow is missing.
  StreamInfo info = 3;
}

// StreamInfo describes the scope a GetFlows stream was opened with.
message StreamInfo {
  // The Namespaces the client named and was authorized to observe. Empty when
  // cluster_wide is set.
  repeated string authorized_namespaces = 1;
  // Whether the stream is cluster-wide, in which case every record is streamed
  // and nothing is redacted.
  bool cluster_wide = 2;
}
